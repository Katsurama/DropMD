name: PR 回归测试

on: pull_request

permissions:
  contents: read

jobs:
  tests:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DROPMD_SKIP_VISION_SELFTEST: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          tools/test_codec.sh
          tools/test_editor.sh
          tools/test_update.sh
          tools/test_convert.sh
          tools/test_preview.sh
          tools/test_l10n.sh
